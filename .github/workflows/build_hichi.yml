name: Build Hichi ESP32-C3 SML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD
          echo "Last commit:"
          git log -1 --oneline

      - name: Show custom configuration files
        run: |
          echo "===== platformio_override.ini ====="
          test -f platformio_override.ini
          cat platformio_override.ini

          echo
          echo "===== tasmota/user_config_override.h ====="
          test -f tasmota/user_config_override.h
          cat tasmota/user_config_override.h

          echo
          echo "===== workflow build command ====="
          grep -n "platformio run" .github/workflows/build_hichi.yml

      - name: Verify custom environment exists
        run: |
          grep -q '^\[env:hichi32c3\]' platformio_override.ini || {
            echo "ERROR: Environment [env:hichi32c3] fehlt."
            exit 1
          }

          grep -q 'USE_SCRIPT' tasmota/user_config_override.h || {
            echo "ERROR: USE_SCRIPT fehlt."
            exit 1
          }

          grep -q 'USE_SML_M' tasmota/user_config_override.h || {
            echo "ERROR: USE_SML_M fehlt."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install PlatformIO
        run: uv pip install --system pioarduino

      - name: List PlatformIO environments
        run: platformio project config

      - name: Build Hichi ESP32-C3 firmware
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "Starting custom environment hichi32c3"
          platformio run -e hichi32c3

      - name: Show generated files
        run: |
          echo "===== .pio output ====="
          find .pio/build/hichi32c3 -maxdepth 2 -type f -print || true

          echo
          echo "===== build_output ====="
          find build_output -type f -print || true

      - name: Collect firmware
        run: |
          mkdir -p artifact

          ELF=".pio/build/hichi32c3/firmware.elf"
          BIN=".pio/build/hichi32c3/firmware.bin"

          echo "===== Verifying compiled features ====="

          test -f "$ELF" || {
            echo "ERROR: firmware.elf fehlt"
            exit 1
          }

          test -f "$BIN" || {
            echo "ERROR: firmware.bin fehlt"
            exit 1
          }

          NM="$(find ~/.platformio/packages -type f -name 'riscv32-esp-elf-nm' | head -n 1)"

          test -n "$NM" || {
            echo "ERROR: riscv32-esp-elf-nm nicht gefunden"
            exit 1
          }

          echo "Using nm: $NM"

          "$NM" -C "$ELF" | grep -q 'Xdrv10' || {
            echo "ERROR: Script-Treiber Xdrv10 fehlt"
            exit 1
          }

          "$NM" -C "$ELF" | grep -q 'Xsns53' || {
            echo "ERROR: Smart-Meter-Treiber Xsns53 fehlt"
            exit 1
          }

          echo "OK: Script-Treiber Xdrv10 vorhanden"
          echo "OK: Smart-Meter-Treiber Xsns53 vorhanden"

          cp "$BIN" "artifact/hichi32c3-sml.bin"

          echo "===== Firmware artifact ====="
          ls -lh artifact/hichi32c3-sml.bin
          sha256sum artifact/hichi32c3-sml.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hichi-esp32c3-sml-firmware
          path: artifact/hichi32c3-sml.bin
          if-no-files-found: error
          retention-days: 14
