name: Build Hichi ESP32-C3 SML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD
          echo "Last commit:"
          git log -1 --oneline

      - name: Show custom configuration files
        run: |
          echo "===== platformio_override.ini ====="
          cat platformio_override.ini

          echo
          echo "===== tasmota/user_config_override.h ====="
          cat tasmota/user_config_override.h

          echo
          echo "===== workflow build command ====="
          grep -n "platformio run" .github/workflows/build_hichi.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install PlatformIO
        run: uv pip install --system pioarduino

      - name: Build Hichi ESP32-C3 firmware
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          echo "Starting custom environment hichi32c3"
          platformio run -e hichi32c3

      - name: Verify compiled drivers
        run: |
          ELF=".pio/build/hichi32c3/firmware.elf"

          if [ ! -f "$ELF" ]; then
            echo "ERROR: firmware.elf not found"
            exit 1
          fi

          NM=$(find ~/.platformio/packages -type f -name "riscv32-esp-elf-nm" | head -n1)

          if [ -z "$NM" ]; then
            echo "ERROR: riscv32-esp-elf-nm not found"
            exit 1
          fi

          echo "===== Looking for Script driver ====="
          if "$NM" -C "$ELF" | grep -i Xdrv10 ; then
            echo "Script driver found"
          else
            echo "ERROR: Script driver missing"
            exit 1
          fi

          echo
          echo "===== Looking for Sensor53 driver ====="
          if "$NM" -C "$ELF" | grep -i Xsns53 ; then
            echo "Sensor53 driver found"
          else
            echo "ERROR: Sensor53 driver missing"
            exit 1
          fi

      - name: Collect firmware
        run: |
          mkdir -p artifact

          cp .pio/build/hichi32c3/firmware.bin artifact/hichi32c3.bin

          if [ -f .pio/build/hichi32c3/firmware.factory.bin ]; then
            cp .pio/build/hichi32c3/firmware.factory.bin artifact/hichi32c3.factory.bin
          fi

          echo
          echo "===== Firmware ====="
          ls -lh artifact

          sha256sum artifact/*

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: hichi-esp32c3-sml-firmware
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
