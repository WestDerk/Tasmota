name: Build Hichi ESP32-C3 SML

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install PlatformIO
        run: uv pip install --system pioarduino

      - name: Build Hichi ESP32-C3 firmware
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: platformio run -e hichi32c3

      - name: Show generated firmware files
        run: |
          echo "Generated files:"
          find build_output -type f -print || true

      - name: Verify Smart Meter support
        run: |
          BIN="$(find build_output -type f -name '*.bin' ! -name '*factory*' ! -name '*safeboot*' | head -n 1)"

          echo "Checking firmware: $BIN"

          if [ -z "$BIN" ]; then
            echo "No OTA firmware file found."
            exit 1
          fi

          if strings "$BIN" | grep -qiE "Sensor53|No meter section"; then
            echo "Sensor53/SML text found in firmware."
          else
            echo "Warning: Sensor53 text was not found in the binary."
            echo "The build will continue; check the compile log for the Hichi override warning."
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hichi-esp32c3-sml-firmware
          path: |
            build_output/**/*.bin
            build_output/**/*.bin.gz
          if-no-files-found: error
          retention-days: 14
