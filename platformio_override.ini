[platformio]
default_envs = hichi32c3

[env:hichi32c3]
extends = env:tasmota32_base
board = esp32c3

build_flags =
    ${env:tasmota32_base.build_flags}
    -DUSE_CONFIG_OVERRIDE
    -DCODE_IMAGE_STR='"hichi-sml-v2"'
    -DOTA_URL='""'
    -UUSE_RULES
    -DUSE_SCRIPT
    -DUSE_SML_M
    -UMAX_METERS
    -DMAX_METERS=1
    -USML_BSIZ
    -DSML_BSIZ=512
    -UTMSBSIZ
    -DTMSBSIZ=1024

lib_ignore =
    ${env:tasmota32_base.lib_ignore}
    Micro-RTSP
